    <link id="dynamic-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121214'/><text x='50' y='66' font-size='48' font-family='monospace' font-weight='bold' fill='%2306B6D4' text-anchor='middle'>/&gt;_</text></svg>">

    <script>
        // 1. РОУТИНГ: Если ширина экрана больше 768px, невидимо кидаем на десктоп
        if (window.innerWidth >= 768) {
            window.location.replace('index.html');
        }
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) window.location.replace('index.html');
        });

        // 2. Тема (Применяется мгновенно)
        const isDark = localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');

        const cachedCss = localStorage.getItem('priority_theme_css_cache');
        if (cachedCss) {
            const style = document.createElement('style');
            style.id = 'dynamic-theme-styles';
            style.innerHTML = cachedCss;
            document.head.appendChild(style);
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        :root {
            --color-brand-light: #0891B2; --color-brand-dark: #06B6D4;
            --color-base-light: #FAFAFA; --color-base-dark: #09090B;
            --color-panel-light: #ffffff; --color-panel-dark: #121214;
            --color-border-light: #d4d4d8; --color-border-dark: #27272a;
            --font-primary: 'JetBrains Mono', monospace;
        }
        body { font-family: var(--font-primary); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .btn-press:active { transform: scale(0.95); transition: transform 0.1s ease; }
        .strike-through { text-decoration: line-through; opacity: 0.5; }
        
        /* Скрытие скроллбара для горизонтального фильтра снизу */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Кастомный чекбокс */
        .tech-checkbox { appearance: none; } 
        .tech-checkbox:checked { background-color: var(--color-brand-light); border-color: var(--color-brand-light); }
        .dark .tech-checkbox:checked { background-color: var(--color-brand-dark); border-color: var(--color-brand-dark); box-shadow: 0 0 10px rgba(255,255,255, 0.1); }
        .tech-checkbox:checked::after { content: '✓'; color: #FFF; display: flex; justify-content: center; align-items: center; height: 100%; font-size: 14px; font-weight: 800; }
        .dark .tech-checkbox:checked::after { color: #000; }
    </style>

    <script>
        const SUPABASE_URL = 'https://ylhjwrckfisxjjjugzpo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_H3bf6T5zv1NkBcyJcm8Gew_zDjtTz9W';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tasks = [];
        let scopes = [];
        let sharedScopes = [];
        let sharedTasks = [];
        let liteTasks = [];
        let activeFilterScope = 'ALL';
        
        let editTaskId = null;
        let isLiteMode = false;
        let openCommentsSet = new Set();
        let escalatedLiteTaskId = null;

        function getDateTimeStr() { 
            const d = new Date(); 
            return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${String(d.getFullYear()).slice(2)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; 
        }

        // --- ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ ---
        let cloudSyncTimeout = null;

        function saveData(key, data) { 
            localStorage.setItem(key, JSON.stringify(data)); 

            const username = localStorage.getItem('priority_user');
            if (!username) return;

            clearTimeout(cloudSyncTimeout);
            cloudSyncTimeout = setTimeout(async () => {
                const mutationId = Date.now().toString() + Math.random().toString(36).substring(7);
                localStorage.setItem('priority_last_mutation', mutationId);

                const appState = {
                    _mutation_id: mutationId,
                    scopes: JSON.parse(localStorage.getItem('priority_scopes') || '[]'),
                    tasks: JSON.parse(localStorage.getItem('priority_tasks') || '[]'),
                    macros: JSON.parse(localStorage.getItem('priority_macros') || '[]'),
                    templates: JSON.parse(localStorage.getItem('priority_templates') || '[]'),
                    badges: JSON.parse(localStorage.getItem('priority_badges') || '[]'),
                    theme: localStorage.getItem('priority_theme') || 'cyber',
                    cursor: localStorage.getItem('priority_cursor') || 'default',
                    lang: localStorage.getItem('priority_lang') || 'en',
                    shop_module: localStorage.getItem('priority_shop_module') || 'false',
                    currency: localStorage.getItem('priority_currency') || '₽',
                    scale: localStorage.getItem('priority_scale') || '1',
                    lite_tasks: JSON.parse(localStorage.getItem('priority_lite_tasks') || '[]'),
                    lite_log: JSON.parse(localStorage.getItem('priority_lite_log') || '{}'),
                    lite_cron_time: localStorage.getItem('lite_cron_time') || '00:00',
                    lite_cron_action: localStorage.getItem('lite_cron_action') || 'fail'
                };

                try {
                    await supabaseClient.from('users').update({ 
                        app_data: appState,
                        last_active_at: new Date().toISOString() 
                    }).eq('username', username);
                } catch (err) {}
            }, 1500);
        }

        function showToast(title, desc, type = 'success') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            let colorClass = type === 'error' ? 'border-red-500 text-red-500' : type === 'success' ? 'border-emerald-500 text-emerald-500' : 'border-brand-light text-brand-light';
            toast.className = `bg-panel-light dark:bg-panel-dark ${colorClass} shadow-lg border p-4 rounded-lg flex items-start gap-3 relative pointer-events-auto transition-colors`;
            toast.innerHTML = `<div class="w-full flex-1"><div class="text-[9px] font-black uppercase tracking-[0.2em] mb-1">${title}</div><div class="font-bold text-xs">${desc}</div></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // --- АВТОРИЗАЦИЯ И РОУТИНГ ---
        function checkAuth() {
            const isAuth = localStorage.getItem('priority_auth') === 'true';
            if (!isAuth) {
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('mobileHeader').classList.add('hidden');
                document.getElementById('authScreen').classList.remove('hidden');
                return;
            }
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('mobileHeader').classList.remove('hidden');
            loadMobileData(); 
        }

        async function requestTelegramCode() {
            let loginInput = document.getElementById('tgLogin').value.trim().toLowerCase();
            if (!loginInput) return showToast('ERROR', 'Введите Telegram username', 'error');
            if (!loginInput.startsWith('@')) loginInput = '@' + loginInput;

            showToast('SYSTEM', 'Запрос кода...', 'info');

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/telegram-webhook`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'send_otp', username: loginInput })
                });
                const result = await response.json();

                if (result.success) {
                    showToast('SECURE', 'Код отправлен в Telegram!', 'success');
                    document.getElementById('authStep1').classList.add('hidden');
                    const s2 = document.getElementById('authStep2');
                    s2.classList.remove('hidden');
                    setTimeout(() => s2.classList.remove('opacity-0', 'translate-y-4'), 50);
                    setTimeout(() => document.querySelectorAll('.code-cell')[0].focus(), 300);
                } else {
                    showToast('DENIED', 'Вы не зарегистрированы или не нажали /start в боте', 'error');
                }
            } catch (err) { showToast('ERROR', 'Ошибка сети', 'error'); }
        }

        async function confirmLogin() {
            const codeInputs = document.querySelectorAll('.code-cell');
            const code = Array.from(codeInputs).map(i => i.value).join('');
            let loginInput = document.getElementById('tgLogin').value.trim().toLowerCase();
            if (!loginInput.startsWith('@')) loginInput = '@' + loginInput;

            if (code.length < 4) return showToast('ERROR', 'Введите 4 цифры', 'error');

            try {
                const { data: otpRecord, error } = await supabaseClient
                    .from('otp_codes').select('*').eq('username', loginInput).eq('code', code).eq('used', false)
                    .order('created_at', { ascending: false }).limit(1).single();

                if (error || !otpRecord) return showToast('DENIED', 'Неверный или устаревший код', 'error');

                await supabaseClient.from('otp_codes').update({ used: true }).eq('id', otpRecord.id);

                localStorage.setItem('priority_auth', 'true');
                localStorage.setItem('priority_user', loginInput);
                showToast('SYSTEM', 'Доступ разрешен', 'success');
                checkAuth();
            } catch (err) { showToast('ERROR', 'Ошибка проверки', 'error'); }
        }

        // --- УМНЫЙ ВВОД OTP ---
        document.addEventListener('DOMContentLoaded', () => {
            const codeInputs = document.querySelectorAll('.code-cell');
            codeInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/[^0-9]/g, '');
                    if (val.length > 1) {
                        e.target.value = val[0] || '';
                        codeInputs.forEach((cell, idx) => { if (idx >= index && (idx - index) < val.length) cell.value = val[idx - index]; });
                        const focusIndex = Math.min(index + val.length - 1, 3);
                        codeInputs[focusIndex].focus();
                        if (codeInputs[3].value !== '') confirmLogin();
                        return;
                    }
                    e.target.value = val;
                    if (val.length === 1) {
                        if (index < codeInputs.length - 1) codeInputs[index + 1].focus();
                        else confirmLogin();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        codeInputs[index - 1].focus();
                        codeInputs[index - 1].value = '';
                    }
                });
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = e.clipboardData.getData('text').trim().replace(/[^0-9]/g, '');
                    if (pasteData.length >= 4) {
                        codeInputs.forEach((cell, idx) => { cell.value = pasteData[idx] || ''; });
                        codeInputs[codeInputs.length - 1].focus();
                        confirmLogin();
                    }
                });
            });
        });

        function initDynamicScopes() {
            const dropdown = document.getElementById('scopeDropdown');
            const personalScopes = scopes.filter(s => !sharedScopes.find(ss => ss.name === s));
            const renderScopes = [...personalScopes, ...sharedScopes.map(s => s.name), 'SYS_OTHER'];
            
            // Генерируем элементы дропдауна
            dropdown.innerHTML = renderScopes.map(s => {
                const isShared = sharedScopes.some(ss => ss.name === s);
                const icon = isShared ? '👥 ' : '';
                const display = s === 'SYS_OTHER' ? 'ДРУГОЕ' : s;
                return `<div onclick="setCustomDropdown('scope', '${s}', '${icon}${display}')" class="px-5 py-5 text-sm font-bold uppercase text-zinc-700 dark:text-zinc-300 hover:bg-base-light dark:hover:bg-base-dark cursor-pointer border-b border-borderline-light dark:border-borderline-dark truncate flex items-center transition-colors">${icon}${display}</div>`;
            }).join('');
            
            // Проверка текущего значения
            const currentVal = document.getElementById('mobileScopeSelect').value;
            if (!currentVal || !renderScopes.includes(currentVal)) {
                document.getElementById('mobScopeLabel').innerText = 'ВЫБЕРИТЕ СФЕРУ';
                document.getElementById('mobileScopeSelect').value = '';
                document.getElementById('mobileAssigneeSelect').classList.add('hidden');
            } else {
                const isShared = sharedScopes.some(ss => ss.name === currentVal);
                const icon = isShared ? '👥 ' : '';
                const display = currentVal === 'SYS_OTHER' ? 'ДРУГОЕ' : currentVal;
                document.getElementById('mobScopeLabel').innerText = `${icon}${display}`;
            }
        }

        async function syncMobileScope() {
            const scopeName = document.getElementById('mobileScopeSelect').value;
            const assigneeSelect = document.getElementById('mobileAssigneeSelect');
            if(!scopeName) return;

            const sharedScope = sharedScopes.find(s => s.name === scopeName);
            if (sharedScope) {
                assigneeSelect.classList.remove('hidden');
                assigneeSelect.classList.add('flex');
                const { data: members } = await supabaseClient.from('scope_members').select('username').eq('scope_id', sharedScope.id);
                if (members) {
                    assigneeSelect.innerHTML = members.map(m => `<option value="${m.username}">${m.username === localStorage.getItem('priority_user') ? '@me' : m.username}</option>`).join('');
                }
            } else {
                assigneeSelect.classList.add('hidden');
                assigneeSelect.classList.remove('flex');
            }
        }

        function renderFilters() {
            const container = document.getElementById('scopeFilterContainer');
            const allScopeNames = Array.from(new Set([...scopes, ...sharedScopes.map(s => s.name), 'SYS_OTHER']));
            const activeTasks = tasks.filter(t => !t.completed);
            
            const counts = {};
            allScopeNames.forEach(s => {
                if (s === 'SYS_OTHER') {
                    counts[s] = activeTasks.filter(task => task.sphere === 'SYS_OTHER' || !allScopeNames.includes(task.sphere)).length;
                } else {
                    counts[s] = activeTasks.filter(task => task.sphere === s).length;
                }
            });

            const sortedScopes = [...allScopeNames].sort((a, b) => (counts[b] || 0) - (counts[a] || 0));
            
            let html = `<button onclick="toggleFilter('ALL')" class="shrink-0 px-3 py-2 text-[10px] font-bold uppercase tracking-widest border transition-all rounded ${activeFilterScope === 'ALL' ? 'bg-brand-light text-white border-transparent' : 'bg-panel-light dark:bg-panel-dark text-zinc-500 border-borderline-light dark:border-borderline-dark'}">ВСЕ</button>`;
            
            sortedScopes.forEach(scope => {
                const isActive = activeFilterScope === scope;
                const displayName = scope === 'SYS_OTHER' ? 'ДРУГОЕ' : scope;
                const taskCount = counts[scope] || 0;
                html += `<button onclick="toggleFilter('${scope}')" class="shrink-0 px-3 py-2 text-[10px] font-bold uppercase tracking-widest border transition-all rounded flex items-center gap-1 ${isActive ? 'bg-zinc-800 dark:bg-zinc-100 text-white dark:text-black border-transparent' : 'bg-panel-light dark:bg-panel-dark text-zinc-500 border-borderline-light dark:border-borderline-dark'}">${displayName} <span class="opacity-50 text-[8px]">[${taskCount}]</span></button>`;
            });
            container.innerHTML = html;
        }

        function toggleFilter(scope) {
            activeFilterScope = scope; 
            renderFilters(); 
            renderTasks();
        }

        // ==========================================
        // СОЗДАНИЕ И РЕДАКТИРОВАНИЕ
        // ==========================================
        async function deployOrUpdateMobileTask() {
            const input = document.getElementById('mobileTaskInput');
            if(!input.value.trim()) return showToast('ERROR', 'Пустая задача', 'error');

            const sphereVal = document.getElementById('mobileScopeSelect').value;
            
            // ЗАЩИТА ОТ ПУСТОЙ СФЕРЫ
            if (!isLiteMode && !sphereVal) return showToast('ERROR', 'Выберите сферу', 'error');

            if (isLiteMode && !editTaskId) {
                liteTasks.push({ id: Date.now().toString(), text: input.value.trim(), status: 'active', date: new Date().toISOString() });
                saveData('priority_lite_tasks', liteTasks);
                input.value = ''; renderDashLite(); toggleLiteMode();
                return showToast('LITE', 'Добавлено в буфер', 'success');
            }

            const impVal = document.getElementById('mobileImpSelect').value === 'yes';
            const urgVal = document.getElementById('mobileUrgSelect').value === 'yes';
            const sharedScope = sharedScopes.find(s => s.name === sphereVal);
            const username = localStorage.getItem('priority_user');

            if (editTaskId) {
                const sharedTask = sharedTasks.find(x => String(x.id) === String(editTaskId));
                if (sharedTask) {
                    sharedTask.title = input.value; sharedTask.is_important = impVal; sharedTask.is_urgent = urgVal;
                    cancelMobileEdit();
                    await supabaseClient.from('shared_tasks').update({ title: sharedTask.title, is_important: impVal, is_urgent: urgVal }).eq('id', editTaskId);
                    renderTasks();
                } else {
                    const taskObj = tasks.find(x => String(x.id) === String(editTaskId));
                    if (taskObj) {
                        taskObj.title = input.value; taskObj.sphere = sphereVal; taskObj.isImportant = impVal; taskObj.isUrgent = urgVal;
                        cancelMobileEdit();
                        saveData('priority_tasks', tasks);
                        renderTasks();
                    }
                }
            } else {
                if (sharedScope) {
                    const assignee = document.getElementById('mobileAssigneeSelect').value || username;
                    const finalAssignee = (assignee === 'me' || assignee === '@me') ? username : assignee;
                    let targetStatus = 'inbox';
                    if (finalAssignee === username) targetStatus = (impVal && urgVal) ? 'q1' : (impVal && !urgVal) ? 'q2' : (!impVal && urgVal) ? 'q3' : 'q4';

                    const tempId = 'temp_' + Date.now();
                    const tempTask = { id: tempId, scope_id: sharedScope.id, title: input.value, creator_username: username, assignee_username: finalAssignee, is_important: impVal, is_urgent: urgVal, is_acknowledged: finalAssignee === username, status: targetStatus, created_at: new Date().toISOString() };
                    sharedTasks.push(tempTask);
                    input.value = ''; renderInbox(); renderTasks(); renderFilters();

                    const { data } = await supabaseClient.from('shared_tasks').insert({ scope_id: sharedScope.id, title: tempTask.title, creator_username: tempTask.creator_username, assignee_username: tempTask.assignee_username, is_important: tempTask.is_important, is_urgent: tempTask.is_urgent, is_acknowledged: tempTask.is_acknowledged, status: tempTask.status }).select().single();
                    if(data) { const idx = sharedTasks.findIndex(t => String(t.id) === String(tempId)); if (idx > -1) sharedTasks[idx] = data; 
                        if (finalAssignee !== username) {
                            fetch(`${SUPABASE_URL}/functions/v1/telegram-webhook`, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'notify_task', target: finalAssignee, actor: username, taskTitle: input.value })
                            }).catch(()=>{});
                        }
                    }
                } else {
                    const d = new Date(); const dateStr = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}`;
                    tasks.unshift({ id: Date.now(), title: input.value, sphere: sphereVal, isImportant: impVal, isUrgent: urgVal, completed: false, createdAt: dateStr, comments: [] });
                    input.value = ''; saveData('priority_tasks', tasks); renderTasks(); renderFilters();
                }
                
                setCustomDropdown('imp', 'yes');
                setCustomDropdown('urg', 'no');
                
                if (escalatedLiteTaskId) {
                    liteTasks = liteTasks.filter(x => String(x.id) !== String(escalatedLiteTaskId));
                    saveData('priority_lite_tasks', liteTasks);
                    escalatedLiteTaskId = null; renderDashLite();
                }
            }
        }

        function editTask(id) {
            let tObj = tasks.find(x => String(x.id) === String(id));
            if (!tObj) {
                const sharedT = sharedTasks.find(x => String(x.id) === String(id));
                if (sharedT) tObj = { title: sharedT.title, sphere: sharedScopes.find(s => s.id === sharedT.scope_id)?.name || 'SYS_OTHER', isImportant: sharedT.is_important, isUrgent: sharedT.is_urgent };
            }
            if (!tObj) return;

            editTaskId = id;
            document.getElementById('mobileTaskInput').value = tObj.title;
            document.getElementById('mobileScopeSelect').value = tObj.sphere;
            syncMobileScope();
            
            setCustomDropdown('imp', tObj.isImportant ? 'yes' : 'no');
            setCustomDropdown('urg', tObj.isUrgent ? 'yes' : 'no');
            
            document.getElementById('mobileDeployBtn').innerText = '✓';
            document.getElementById('mobileCancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

            document.getElementById('mobileTaskInput').value = '';

            document.getElementById('mobileDeployBtn').innerText = '+';

        async function toggleTask(id) {
            // Проверяем, общая ли это задача (по наличию дефиса от UUID или temp-префикса)
            const isSharedId = String(id).includes('-') || String(id).startsWith('temp_');

            if (isSharedId) {
                if (String(id).startsWith('temp_')) return showToast('INFO', 'Синхронизация...', 'info');
                
                const sharedTask = sharedTasks.find(t => String(t.id) === String(id));
                if (!sharedTask) return;

                const newStatus = sharedTask.status === 'completed' ? 'active' : 'completed';
                const completedTime = newStatus === 'completed' ? new Date().toISOString() : null;
                const username = localStorage.getItem('priority_user');
                
                try {
                    sharedTask.status = newStatus;
                    sharedTask.completed_at = completedTime;
                    renderTasks();
                    await supabaseClient.from('shared_tasks').update({ status: newStatus, completed_at: completedTime }).eq('id', id);
                    
                    // ---> ПИНГ В ТЕЛЕГРАМ ОБ ИСПОЛНЕНИИ ЗАДАЧИ <---
                    if (newStatus === 'completed') {
                        const targetUser = sharedTask.creator_username === username ? sharedTask.assignee_username : sharedTask.creator_username;
                        if (targetUser && targetUser !== username) {
                            fetch(`${SUPABASE_URL}/functions/v1/telegram-webhook`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    action: 'notify_completion', 
                                    target: targetUser,
                                    actor: username,
                                    taskTitle: sharedTask.title
                                })
                            }).catch(()=>{});
                        }
                    }
                } catch(e) {
                    showToast('ERROR', 'Ошибка сети', 'error');
                }
                return;
            }

            // ---> ЛОКАЛЬНЫЕ ЗАДАЧИ <---
            const task = tasks.find(t => String(t.id) === String(id));
            if (task) {
                if (!task.completed) {
                    task.completed = true;
                    task.completedAt = getDateTimeStr(); // Обязательно добавляем дату для архива на ПК!
                } else {
                    task.completed = false;
                }
                saveData('priority_tasks', tasks);
                renderTasks(); 
                renderFilters();
            }
        }

        async function deleteTask(id) {
            if (String(id).startsWith('temp_')) return;
            const isShared = sharedTasks.some(t => String(t.id) === String(id));
            
            if(isShared) {
                sharedTasks = sharedTasks.filter(t => String(t.id) !== String(id));
                renderTasks(); renderFilters();
                await supabaseClient.from('shared_tasks').delete().eq('id', id);
            } else {
                tasks = tasks.filter(t => String(t.id) !== String(id));
                saveData('priority_tasks', tasks);
                renderTasks(); renderFilters();
            }
            showToast('СИСТЕМА', 'Задача удалена', 'info');
        }

        // ==========================================
        // ОТРИСОВКА ЗАДАЧ И МАППИНГ
        // ==========================================
        function renderTasks() {
            const username = localStorage.getItem('priority_user');
            const qLists = [document.getElementById('listQ1'), document.getElementById('listQ2'), document.getElementById('listQ3'), document.getElementById('listQ4')];
            qLists.forEach(l => l.innerHTML = '');
            
            const acceptedShared = sharedTasks.filter(t => !(t.assignee_username === username && t.status === 'inbox')).map(t => ({
                id: t.id, title: t.title, sphere: sharedScopes.find(s => s.id === t.scope_id)?.name || 'SYS_OTHER',
                isImportant: t.is_important, isUrgent: t.is_urgent, completed: t.status === 'completed',
                comments: t.shared_comments || [], isShared: true, creator: t.creator_username, assignee: t.assignee_username
            }));
            
            const allTasks = [...tasks, ...acceptedShared].filter(t => !t.completed).sort((a, b) => b.id - a.id);

            allTasks.forEach(task => {
                const effectiveSphere = task.sphere;
                if (activeFilterScope !== 'ALL' && activeFilterScope !== effectiveSphere) return;
                
                const quad = (task.isImportant && task.isUrgent) ? 1 : (task.isImportant && !task.isUrgent) ? 2 : (!task.isImportant && task.isUrgent) ? 3 : 4;
                const isCommentsOpen = openCommentsSet.has(task.id);
                
                const commentsHTML = `
                    <div id="comments-${task.id}" class="mt-3 pt-3 border-t border-borderline-light dark:border-borderline-dark ${isCommentsOpen ? '' : 'hidden'}">
                        <div class="space-y-2 mb-3">
                            ${task.comments.map(c => `<div class="bg-base-light dark:bg-base-dark p-2 rounded text-xs"><span class="font-bold text-brand-light mr-1">${c.author_username || '>'}</span>${c.text}</div>`).join('')}
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="comment-input-${task.id}" class="flex-1 bg-base-light dark:bg-base-dark border border-borderline-light dark:border-borderline-dark rounded px-2 text-xs outline-none" placeholder="Сообщение...">
                            <button onclick="addComment('${task.id}')" class="px-3 bg-brand-light text-white rounded text-xs font-bold btn-press">✓</button>
                        </div>
                    </div>
                `;

                // Исполнитель
                const assigneeName = task.assignee === username ? 'МНЕ' : task.assignee;
                const sharedBadge = task.isShared ? `<span class="px-2 py-0.5 bg-brand-light/10 text-brand-light border border-brand-light/30 rounded text-[9px] font-bold uppercase tracking-widest ml-1" title="Создал: ${task.creator}">👤 ${assigneeName}</span>` : '';

                qLists[quad - 1].innerHTML += `
                    <div class="flex flex-col p-3 bg-panel-light dark:bg-panel-dark border border-borderline-light dark:border-borderline-dark rounded shadow-sm">
                        <div class="flex items-start gap-2">
                            <input type="checkbox" onchange="toggleTask('${task.id}')" class="tech-checkbox w-5 h-5 mt-0.5 rounded border border-zinc-300 dark:border-zinc-600 bg-base-light dark:bg-base-dark shrink-0">
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-sm leading-snug">${task.title}</div>
                                
                                <div class="flex items-center justify-between mt-3 pt-2 border-t border-borderline-light dark:border-borderline-dark w-full">
                                    <div class="flex items-center gap-1 flex-wrap">
                                        <span class="text-[9px] font-bold text-zinc-500 uppercase px-2 py-0.5 bg-base-light dark:bg-base-dark border border-borderline-light dark:border-borderline-dark rounded">${effectiveSphere === 'SYS_OTHER' ? 'ДРУГОЕ' : effectiveSphere}</span>
                                        ${sharedBadge}
                                    </div>
                                    
                                    <div class="flex flex-row items-center gap-2 shrink-0">
                                        <button onclick="editTask('${task.id}')" class="w-8 h-8 bg-base-light dark:bg-base-dark rounded flex items-center justify-center text-xs btn-press border border-borderline-light dark:border-borderline-dark">✏️</button>
                                        <button onclick="toggleComments('${task.id}')" class="w-8 h-8 bg-base-light dark:bg-base-dark rounded flex items-center justify-center text-xs btn-press border border-borderline-light dark:border-borderline-dark relative">📝${task.comments.length > 0 ? `<span class="absolute -top-1 -right-1 text-[8px] bg-brand-light text-white px-1.5 rounded">${task.comments.length}</span>` : ''}</button>
                                        <button onclick="deleteTask('${task.id}')" class="w-8 h-8 bg-red-50 dark:bg-red-500/10 text-red-500 rounded flex items-center justify-center text-xs btn-press border border-red-200 dark:border-red-500/30" title="Удалить">🗑️</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ${commentsHTML}
                    </div>
                `;
            });
            qLists.forEach(l => { if(l.innerHTML === '') l.innerHTML = `<div class="text-[10px] text-zinc-500 text-center uppercase tracking-widest mt-2">Пусто</div>`; });
        }

        function toggleComments(id) {
            const box = document.getElementById(`comments-${id}`);
            if(box.classList.contains('hidden')) { box.classList.remove('hidden'); openCommentsSet.add(id); } 
            else { box.classList.add('hidden'); openCommentsSet.delete(id); }
        }

        async function addComment(id) {
            const input = document.getElementById(`comment-input-${id}`);
            if(!input || !input.value.trim()) return;
            const text = input.value.trim();
            const username = localStorage.getItem('priority_user');
            
            const sharedTask = sharedTasks.find(t => String(t.id) === String(id));
            if (sharedTask) {
                const { data } = await supabaseClient.from('shared_comments').insert({ task_id: id, author_username: username, text: text }).select().single();
                if(!sharedTask.shared_comments) sharedTask.shared_comments = [];
                sharedTask.shared_comments.push(data);
                
                // --- ОТПРАВКА УВЕДОМЛЕНИЯ В ТГ ---
                const targetUser = sharedTask.creator_username === username ? sharedTask.assignee_username : sharedTask.creator_username;
                if (targetUser && targetUser !== username) {
                    fetch(`${SUPABASE_URL}/functions/v1/telegram-webhook`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'notify_comment', target: targetUser, actor: username, taskTitle: sharedTask.title, commentText: text })
                    }).catch(()=>{});
                }
                // ---------------------------------
            } else {
                tasks.find(t => String(t.id) === String(id)).comments.push({ text: text, author_username: username });
                saveData('priority_tasks', tasks);
            }
            input.value = ''; renderTasks(); setTimeout(() => toggleComments(id), 50);
        }

        // ==========================================
        // LITE ЗАДАЧИ В СТИЛЕ ТЕГОВ
        // ==========================================
        function getLiteAgeStyle(isoDate) {
            if(!isoDate) return '';
            const diffDays = Math.floor((new Date() - new Date(isoDate)) / (1000*60*60*24));
            if(diffDays <= 0) return '';
            const intensity = Math.min(diffDays / 10, 1);
            return `background-color: rgba(239, 68, 68, ${intensity * 0.15}); border-color: rgba(239, 68, 68, ${intensity * 0.5}); color: ${intensity > 0.5 ? '#ef4444' : ''}`;
        }

        function renderDashLite() {
            const activeLite = liteTasks.filter(t => t.status === 'active');
            document.getElementById('dashLiteCounter').innerText = activeLite.length;
            const container = document.getElementById('dashLiteContainer');
            if(activeLite.length === 0) return container.innerHTML = `<span class="text-[10px] text-zinc-500 uppercase">Буфер пуст</span>`;
            
            // Отрисовываем задачи как крупные теги
            container.innerHTML = activeLite.map(t => {
                const ageStyle = getLiteAgeStyle(t.date);
                return `
                <div class="inline-flex items-center bg-panel-light dark:bg-panel-dark border border-borderline-light dark:border-borderline-dark rounded-full overflow-hidden shadow-sm transition-all" style="${ageStyle}">
                    <span class="pl-4 pr-3 py-2.5 text-sm font-bold truncate max-w-[200px] text-zinc-800 dark:text-zinc-200">${t.text}</span>
                    <div class="flex items-center shrink-0 border-l border-borderline-light dark:border-borderline-dark pr-1">
                        <button onclick="completeDashLiteTask('${t.id}', this)" class="w-9 h-9 rounded-full flex items-center justify-center text-emerald-500 hover:bg-emerald-500/10 transition-colors btn-press text-sm font-bold">✓</button>
                        <button onclick="escalateLiteTask('${t.id}')" class="w-9 h-9 rounded-full flex items-center justify-center text-brand-light hover:bg-brand-light/10 transition-colors btn-press text-sm font-bold">➚</button>
                        <button onclick="deleteDashLite('${t.id}')" class="w-9 h-9 rounded-full flex items-center justify-center text-red-500 hover:bg-red-500/10 transition-colors btn-press text-sm font-bold">✕</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function completeDashLiteTask(id, btnEl) {
            const el = btnEl.closest('.inline-flex');
            if (el) { el.style.opacity = '0'; el.style.transition = 'all 0.2s ease'; }
            setTimeout(() => {
                const t = liteTasks.find(x => x.id === id);
                if(t) {
                    t.status = 'done';
                    saveData('priority_lite_tasks', liteTasks);
                    renderDashLite();
                }
            }, 200);
        }

        function escalateLiteTask(id) {
            const t = liteTasks.find(x => x.id === id);
            if(t) {
                document.getElementById('mobileTaskInput').value = t.text;
                escalatedLiteTaskId = id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function deleteDashLite(id) {
            liteTasks = liteTasks.filter(t => t.id !== id);
            saveData('priority_lite_tasks', liteTasks);
            renderDashLite();
        }

        // ==========================================
        // ИНБОКС И ЛОГАУТ
        // ==========================================
        function renderInbox() {
            const username = localStorage.getItem('priority_user');
            const inboxTasks = sharedTasks.filter(t => t.assignee_username === username && t.status === 'inbox');
            const wrapper = document.getElementById('inboxWrapper');
            if(inboxTasks.length === 0) return wrapper.classList.add('hidden');
            
            wrapper.classList.remove('hidden');
            document.getElementById('inboxTasksContainer').innerHTML = inboxTasks.map(t => `
                <div class="bg-panel-light dark:bg-panel-dark border border-brand-light/30 p-3 rounded">
                    <div class="font-bold text-sm mb-2">${t.title}</div>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <button onclick="acceptInboxTask('${t.id}', 'q1')" class="py-2 bg-red-500/10 text-red-500 rounded text-[9px] font-bold btn-press">Q1 (Крит)</button>
                        <button onclick="acceptInboxTask('${t.id}', 'q2')" class="py-2 bg-brand-light/10 text-brand-light rounded text-[9px] font-bold btn-press">Q2 (Стратег)</button>
                        <button onclick="acceptInboxTask('${t.id}', 'q3')" class="py-2 bg-yellow-500/10 text-yellow-600 rounded text-[9px] font-bold btn-press">Q3 (Рутина)</button>
                        <button onclick="acceptInboxTask('${t.id}', 'q4')" class="py-2 bg-zinc-500/10 text-zinc-500 rounded text-[9px] font-bold btn-press">Q4 (Бэклог)</button>
                    </div>
                </div>
            `).join('');
        }

        async function acceptInboxTask(taskId, targetQuad) {
            sharedTasks = sharedTasks.filter(t => t.id !== taskId); renderInbox();
            try { await supabaseClient.from('shared_tasks').update({ status: targetQuad }).eq('id', taskId); loadSharedScopes(); } catch(e) {}
        }

        function logout() {
            localStorage.removeItem('priority_auth');
            checkAuth();
        }

        checkAuth();
    </script>
</body>
</html>
