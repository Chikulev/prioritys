<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <!-- Темный фон -->
    <rect width="1200" height="630" fill="#09090B"/>
    
    <!-- Техно-сетка -->
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272A" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#grid)"/>
    
    <!-- Центральная иконка (Терминал) -->
    <rect x="500" y="180" width="200" height="200" rx="40" fill="#121214" stroke="#06B6D4" stroke-width="6"/>
    <text x="600" y="310" font-size="80" font-family="monospace" font-weight="bold" fill="#06B6D4" text-anchor="middle">/&gt;_</text>
    
    <!-- Название проекта -->
    <text x="600" y="490" font-size="64" font-family="monospace" font-weight="900" fill="#FAFAFA" text-anchor="middle" letter-spacing="12">PRIORITYS.RU</text>
</svg>
