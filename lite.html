<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        // Мгновенная предзагрузка темы из кэша (убивает белый экран на хостинге)
        const cachedCss = localStorage.getItem('priority_theme_css_cache');
        if (cachedCss) {
            const style = document.createElement('style');
            style.id = 'dynamic-theme-styles';
            style.innerHTML = cachedCss;
            document.head.appendChild(style);
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIORITYS // LITE_BUFFER</title>

    <meta name="description" content="Оперативная память для ваших задач. Мгновенный захват мыслей, синхронизация с Telegram и ежедневная автоочистка.">
    <meta name="author" content="PRIORITYS">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://prioritys.ru/lite.html">
    <meta property="og:title" content="PRIORITYS // LITE_BUFFER">
    <meta property="og:description" content="Очистите нейронные пути. Быстрый буфер для ежедневных задач с интеграцией Telegram Quick Capture.">
    <meta property="og:image" content="https://prioritys.ru/og-image.png">

    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Базовые переменные (фолбэк до загрузки themes.js) */
        :root {
            --color-brand-light: #0891B2; --color-brand-dark: #06B6D4;
            --color-base-light: #FAFAFA; --color-base-dark: #09090B;
            --color-panel-light: #ffffff; --color-panel-dark: #121214;
            --color-border-light: #d4d4d8; --color-border-dark: #27272a;
            --font-primary: 'JetBrains Mono', monospace;
        }

        body { font-family: var(--font-primary); -webkit-font-smoothing: antialiased; }

        /* Системные анимации кнопок */
        .btn-press { transition: transform 0.1s ease; } 
        .btn-press:active { transform: scale(0.95); }

        /* LITE-специфичные классы */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .heatmap-cell { width: 12px; height: 12px; border-radius: 2px; }
        
        /* Системные курсоры */
        body.cursor-tech, body.cursor-tech * { cursor: crosshair !important; }
        body.cursor-royal, body.cursor-royal * { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' style='font-size:20px;'><text y='20'>🖋️</text></svg>") 0 20, auto !important; }
        body.cursor-sword, body.cursor-sword * { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' style='font-size:20px;'><text y='20'>🗡️</text></svg>") 0 20, auto !important; }
        body.cursor-wand, body.cursor-wand * { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' style='font-size:20px;'><text y='20'>🪄</text></svg>") 0 20, auto !important; }

        /* Анимация Уведомления BRAVO */
        .animate-bravo { animation: bravo-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes bravo-pop { 
            0% { transform: translate(-50%, 20px); opacity: 0; }
            50% { transform: translate(-50%, -10px); opacity: 1; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        /* Анимация исчезновения тега */
        .tag-vanish { animation: pop-out 0.3s ease-in forwards; }
        @keyframes pop-out {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        /* Масштаб системы */
        html { font-size: calc(16px * var(--system-scale, 1)) !important; }
    </style>

</head>
<body class="bg-base-light dark:bg-base-dark text-zinc-900 dark:text-zinc-100 font-mono min-h-screen pb-20">

    <header class="sticky top-0 z-50 bg-base-light/80 dark:bg-base-dark/80 backdrop-blur-md border-b border-borderline-light dark:border-borderline-dark p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="index.html" class="p-2 hover:bg-zinc-200 dark:hover:bg-zinc-800 rounded transition-all font-black text-xl hover:text-brand-light"><-</a>
                <h1 class="font-black text-[10px] md:text-sm tracking-widest uppercase text-yellow-500">Lite_Engine_v2</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 text-zinc-500 hover:text-yellow-500 transition-colors">
                    <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
                </button>
                <button onclick="toggleLang()" class="text-[10px] font-black px-2 py-1 border border-zinc-300 dark:border-zinc-700 rounded hover:border-yellow-500 transition-colors">EN / RU</button>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto p-6 mt-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
            <div class="bg-panel-light dark:bg-panel-dark p-5 rounded-xl border border-borderline-light dark:border-borderline-dark shadow-sm">
                <div data-i18n="lite_stats_total" class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest mb-1">TOTAL_OPS</div>
                <div id="stat-total" class="text-3xl font-black text-zinc-900 dark:text-zinc-100">0</div>
            </div>
            <div class="bg-panel-light dark:bg-panel-dark p-5 rounded-xl border border-borderline-light dark:border-borderline-dark shadow-sm relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full blur-xl"></div>
                <div data-i18n="lite_stats_done" class="text-[9px] font-bold text-emerald-500 uppercase tracking-widest mb-1">SUCCESS_RATIO</div>
                <div id="stat-done" class="text-3xl font-black text-emerald-500">0</div>
            </div>
            <div class="bg-panel-light dark:bg-panel-dark p-5 rounded-xl border border-borderline-light dark:border-borderline-dark shadow-sm md:col-span-1">
                <div data-i18n="lite_heatmap_title" class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest mb-3">ACTIVITY_LOG // 30_DAYS</div>
                <div id="heatmap" class="grid grid-cols-10 gap-1.5 w-max"></div>
            </div>
        </div>

        <div class="mb-10">
            <h1 data-i18n="lite_title" class="text-2xl font-black uppercase tracking-tighter text-yellow-500 mb-2">LITE_BUFFER // RAM</h1>
            <p data-i18n="lite_desc" class="text-[10px] text-zinc-500 uppercase tracking-widest mb-6">Operational memory for quick daily tasks.</p>
            
            <div class="relative flex items-center group">
                <div class="absolute -inset-1 bg-gradient-to-r from-brand-light to-yellow-500 rounded-2xl blur opacity-10 group-hover:opacity-25 transition duration-1000 pointer-events-none"></div>
                
                <input type="text" id="liteInput" data-i18n-ph="lite_ph" 
                    class="relative w-full bg-panel-light dark:bg-panel-dark border-2 border-borderline-light dark:border-borderline-dark rounded-xl py-6 pl-6 pr-20 text-xl focus:outline-none focus:border-yellow-500 transition-all shadow-xl font-bold placeholder-zinc-300 dark:placeholder-zinc-700"
                    onkeypress="handleLiteKeyPress(event)">
                
                <button onclick="submitLiteInput()" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 flex items-center justify-center bg-yellow-500 text-zinc-900 rounded-lg hover:bg-yellow-400 hover:shadow-[0_0_15px_rgba(234,179,8,0.5)] active:scale-95 transition-all">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
            <div data-i18n="lite_tip" class="mt-4 text-[9px] font-bold text-zinc-400 uppercase tracking-widest text-center animate-pulse">UX_TIP: Левый кружок (О) - выполнить. Правый крестик (X) - удалить.</div>
        </div>

        <div id="liteTagsContainer" class="flex flex-wrap gap-4 mb-16"></div>

        <div class="border-t border-borderline-light dark:border-borderline-dark pt-8">
            <h2 data-i18n="lite_archive_title" class="text-[10px] font-black text-zinc-400 uppercase tracking-widest mb-6">BUFFER_ARCHIVE</h2>
            <div id="liteHistoryContainer" class="space-y-1"></div>
        </div>
    </div>

    <div id="bravoNotice" class="fixed bottom-10 left-1/2 -translate-x-1/2 pointer-events-none hidden z-[100]">
        <div data-i18n="lite_bravo_msg" class="bg-emerald-500 text-white font-black px-6 py-4 rounded-xl shadow-[0_10px_40px_rgba(16,185,129,0.5)] text-xs uppercase tracking-widest border border-emerald-400">
            [ BRAVO! ] TARGET_NEUTRALIZED
        </div>
    </div>

    <script src="themes.js"></script>
    <script src="locales.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ЗАЩИТА РОУТИНГА: Переброс неавторизованных на главную
        if (localStorage.getItem('priority_auth') !== 'true') {
            window.location.href = 'index.html';
        }

        // --- ДАННЫЕ И СОСТОЯНИЕ ---
        let liteTasks = JSON.parse(localStorage.getItem('priority_lite_tasks')) || [];
        let completedLog = JSON.parse(localStorage.getItem('priority_lite_log')) || {};

        // --- ИНИЦИАЛИЗАЦИЯ SUPABASE ---
        const SUPABASE_URL = 'https://ylhjwrckfisxjjjugzpo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_H3bf6T5zv1NkBcyJcm8Gew_zDjtTz9W';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cloudSyncTimeout = null;

        // ФОНОВАЯ ОТПРАВКА ДАННЫХ
        function syncStateToCloud() {
            const username = localStorage.getItem('priority_user');
            if (!username) return;
        
            clearTimeout(cloudSyncTimeout);
            cloudSyncTimeout = setTimeout(async () => {
                const appState = {
                    // Главное Ядро и Настройки (чтобы не затереть их)
                    scopes: JSON.parse(localStorage.getItem('priority_scopes') || '[]'),
                    tasks: JSON.parse(localStorage.getItem('priority_tasks') || '[]'),
                    macros: JSON.parse(localStorage.getItem('priority_macros') || '[]'),
                    templates: JSON.parse(localStorage.getItem('priority_templates') || '[]'),
                    badges: JSON.parse(localStorage.getItem('priority_badges') || '[]'),
                    theme: localStorage.getItem('priority_theme') || 'cyber',
                    cursor: localStorage.getItem('priority_cursor') || 'default',
                    lang: localStorage.getItem('priority_lang') || 'en',
                    shop_module: localStorage.getItem('priority_shop_module') || 'false',
                    currency: localStorage.getItem('priority_currency') || '₽',
                    scale: localStorage.getItem('priority_scale') || '1',

                    // LITE-ДАННЫЕ (Ради чего мы здесь)
                    lite_tasks: JSON.parse(localStorage.getItem('priority_lite_tasks') || '[]'),
                    lite_log: JSON.parse(localStorage.getItem('priority_lite_log') || '{}'),
                    lite_cron_time: localStorage.getItem('lite_cron_time') || '00:00',
                    lite_cron_action: localStorage.getItem('lite_cron_action') || 'fail'
                };

                try {
                    await supabaseClient.from('users').update({ app_data: appState }).eq('username', username);
                    console.log('☁️ Lite Buffer synced to cloud');
                } catch (err) { console.error('Cloud sync failed', err); }
            }, 1500);
        }

        // ФОНОВАЯ ЗАГРУЗКА ПРИ F5
        async function syncFromCloud() {
            const username = localStorage.getItem('priority_user');
            if (!username) return;
        
            try {
                const { data } = await supabaseClient.from('users').select('app_data').eq('username', username).single();
                if (data && data.app_data && Object.keys(data.app_data).length > 0) {
                    const cloudData = data.app_data;
                
                    // Восстанавливаем LITE-память
                    if (cloudData.lite_tasks) {
                        localStorage.setItem('priority_lite_tasks', JSON.stringify(cloudData.lite_tasks));
                        liteTasks = cloudData.lite_tasks;
                    }
                    if (cloudData.lite_log) {
                        localStorage.setItem('priority_lite_log', JSON.stringify(cloudData.lite_log));
                        completedLog = cloudData.lite_log;
                    }
                    if (cloudData.lite_cron_time) localStorage.setItem('lite_cron_time', cloudData.lite_cron_time);
                    if (cloudData.lite_cron_action) localStorage.setItem('lite_cron_action', cloudData.lite_cron_action);
                
                    // Отрисовываем интерфейс новыми данными
                    renderLite();
                    renderStats();
                    renderHeatmap();
                    console.log('☁️ Lite Buffer synchronized from cloud');
                }
            } catch (e) { console.error('Cloud pull failed:', e); }
        }

        // --- CORE UI (СИНХРОНИЗАЦИЯ ЯЗЫКА И ТЕМЫ) ---

        function toggleLang() {
            const currentLang = localStorage.getItem('priority_lang') || 'en';
            localStorage.setItem('priority_lang', currentLang === 'en' ? 'ru' : 'en');
            applyI18n();
            renderLite();
            syncStateToCloud();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('priority_theme_mode', isDark ? 'dark' : 'light');
            updateThemeIcon();
            syncStateToCloud();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('theme-icon');
            if (isDark) {
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />`;
            } else {
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
            }
        }

        // --- LITE ENGINE (ВВОД И УПРАВЛЕНИЕ ЗАДАЧАМИ) ---
        function handleLiteKeyPress(e) {
            if (e.key === 'Enter') submitLiteInput();
        }

        function submitLiteInput() {
            const inputEl = document.getElementById('liteInput');
            const val = inputEl.value.trim();
            if (val !== '') {
                liteTasks.push({
                    id: Date.now().toString(),
                    text: val,
                    status: 'active',
                    date: new Date().toISOString()
                });
                inputEl.value = '';
                saveAndRender();
            }
        }

        // --- АНИМАЦИЯ И ЛОГИКА ВЫПОЛНЕНИЯ ---
        function completeTask(id, btnEl) {
            // Эффект исчезновения тега
            const tagEl = btnEl.closest('.lite-tag');
            tagEl.classList.add('tag-vanish');
            
            setTimeout(() => {
                const task = liteTasks.find(t => t.id === id);
                if(task) {
                    task.status = 'done';
                    task.completedAt = new Date().toISOString().split('T')[0];
                    
                    // Пишем в тепловую карту (Heatmap)
                    const today = task.completedAt;
                    completedLog[today] = (completedLog[today] || 0) + 1;
                    
                    showBravo();
                    saveAndRender();
                }
            }, 300); // Ждем конец анимации
        }

        // --- УДАЛЕНИЕ (РАБОТАЕТ ДЛЯ АКТИВНЫХ И АРХИВНЫХ) ---
        function deleteTask(id) {
            liteTasks = liteTasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('priority_lite_tasks', JSON.stringify(liteTasks));
            localStorage.setItem('priority_lite_log', JSON.stringify(completedLog));
            renderLite();
            renderStats();
            renderHeatmap();
            syncStateToCloud();
        }

        function showBravo() {
            const el = document.getElementById('bravoNotice');
            el.classList.remove('hidden');
            // Перезапуск анимации
            el.classList.remove('animate-bravo');
            void el.offsetWidth; // trigger reflow
            el.classList.add('animate-bravo');
            
            setTimeout(() => el.classList.add('hidden'), 2500);
        }

        // --- ОТРИСОВКА СТАТИСТИКИ ---
        function renderStats() {
            document.getElementById('stat-total').innerText = liteTasks.length;
            document.getElementById('stat-done').innerText = liteTasks.filter(t => t.status === 'done').length;
        }

        function renderHeatmap() {
            const container = document.getElementById('heatmap');
            container.innerHTML = '';
            
            // Генерируем последние 30 дней от сегодня
            for (let i = 29; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dStr = date.toISOString().split('T')[0];
                const count = completedLog[dStr] || 0;
                
                let colorClass = 'bg-zinc-200 dark:bg-zinc-800';
                if (count > 0) colorClass = 'bg-emerald-200 dark:bg-emerald-900';
                if (count > 2) colorClass = 'bg-emerald-400 dark:bg-emerald-600';
                if (count > 4) colorClass = 'bg-emerald-500 dark:bg-emerald-400 shadow-[0_0_5px_var(--color-emerald-500)]';

                container.innerHTML += `<div class="heatmap-cell ${colorClass}" title="${dStr}: ${count} ops"></div>`;
            }
        }

        function getLiteAgeStyle(isoDate) {
            if(!isoDate) return '';
            const diffDays = Math.floor((new Date() - new Date(isoDate)) / (1000*60*60*24));
            if(diffDays <= 0) return '';
            const int = Math.min(diffDays / 10, 1);
            return `background-color: rgba(239, 68, 68, ${int * 0.15}); border-color: rgba(239, 68, 68, ${int * 0.5}); color: ${int > 0.5 ? '#ef4444' : ''}`;
        }

        // --- ОСНОВНАЯ ОТРИСОВКА (ТЕГИ И АРХИВ) ---
        function renderLite() {
            const cloud = document.getElementById('liteTagsContainer');
            const archive = document.getElementById('liteHistoryContainer');
            
            const active = liteTasks.filter(t => t.status === 'active');
            const history = liteTasks.filter(t => t.status !== 'active');

            // 1. АКТИВНЫЕ ЗАДАЧИ (ТЕГИ)
            if(active.length === 0) {
                cloud.innerHTML = `<div data-i18n="lite_empty" class="text-sm font-bold text-zinc-500 italic w-full text-center py-4 border-2 border-dashed border-borderline-light dark:border-borderline-dark rounded-xl opacity-50">${t('lite_empty')}</div>`;
            } else {
                cloud.innerHTML = active.map(t => {
                const ageStyle = getLiteAgeStyle(t.date);
                return `
                    <div class="lite-tag group inline-flex items-center bg-panel-light dark:bg-panel-dark border border-borderline-light dark:border-borderline-dark rounded-full overflow-hidden hover:border-yellow-500 transition-all shadow-sm pr-1" style="${ageStyle}">
                        <button onclick="completeTask('${t.id}', this)" class="pl-4 pr-3 py-3 text-zinc-400 hover:bg-emerald-500/10 group-hover:text-emerald-500 transition-colors focus:outline-none flex items-center justify-center">
                            <svg class="w-5 h-5 relative" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M8 12l2 2 4-4" class="opacity-0 group-hover:opacity-100 transition-opacity" stroke-width="3"></path>
                            </svg>
                        </button>
                        <span class="pr-3 py-2 font-bold text-sm uppercase tracking-wider text-zinc-700 dark:text-zinc-300 pointer-events-none">${t.text}</span>
                        <button onclick="deleteTask('${t.id}')" class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-400 hover:bg-red-500 hover:text-white transition-colors focus:outline-none font-black text-lg">×</button>
                    </div>
                `;
            }).join('');
            }

            // 2. ИСТОРИЯ (АРХИВ С УДАЛЕНИЕМ)
            if(history.length === 0) {
                archive.innerHTML = `<div class="text-xs text-zinc-500 italic">No records found.</div>`;
            } else {
                // Сортируем: новые сверху
                history.sort((a,b) => new Date(b.date) - new Date(a.date));
                
                archive.innerHTML = history.map(t => {
                    let statusColor = 'text-zinc-500';
                    let statusLabel = 'ARCHIVED';
                    
                    if(t.status === 'done') { statusColor = 'text-emerald-500'; statusLabel = 'DONE'; }
                    if(t.status === 'fail') { statusColor = 'text-red-500'; statusLabel = 'FAILED'; }
                    if(t.status === 'overdue') { statusColor = 'text-orange-500'; statusLabel = 'OVERDUE'; }

                    return `
                    <div class="group flex items-center gap-4 text-[10px] font-bold p-2 hover:bg-panel-light dark:hover:bg-panel-dark rounded border border-transparent hover:border-borderline-light dark:hover:border-borderline-dark transition-all">
                        <span class="${statusColor} w-16">[ ${statusLabel} ]</span>
                        <span class="line-through text-zinc-500 dark:text-zinc-400 flex-1 text-xs truncate">${t.text}</span>
                        <span class="text-[9px] text-zinc-400">${t.completedAt || new Date(t.date).toLocaleDateString()}</span>
                        
                        <button onclick="deleteTask('${t.id}')" class="opacity-0 group-hover:opacity-100 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white px-2 py-1 rounded transition-all">DEL</button>
                    </div>
                    `;
                }).join('');
            }
        }

        // --- CRON JOB (АВТО-ОЧИСТКА В КОНЦЕ ДНЯ) ---
        function checkCronJob() {
            const cronAction = localStorage.getItem('lite_cron_action') || 'fail'; // fail, overdue, delete
            const lastRun = localStorage.getItem('lite_cron_last_run') || '';
            const todayStr = new Date().toDateString();
            
            if (lastRun !== todayStr && lastRun !== '') {
                let changed = false;
                liteTasks.forEach(t => {
                    if (t.status === 'active') {
                        if (cronAction === 'delete') t.status = 'deleted';
                        else if (cronAction === 'none') { /* Do nothing, leave it active */ }
                        else t.status = cronAction;
                        changed = true;
                    }
                });
                
                liteTasks = liteTasks.filter(t => t.status !== 'deleted');
                if (changed) localStorage.setItem('priority_lite_tasks', JSON.stringify(liteTasks));
            }
            localStorage.setItem('lite_cron_last_run', todayStr);
        }

        // BOOT SEQUENCE (Запускается мгновенно!)
        initThemeToggle();
        checkAuth();
    </script>
</body>
</html>
